<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Post Explorer | Averon Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>Averon Post Explorer</h1>
            <p class="subtitle">Fetching, Loading, and Searching Live Data from REST API</p>
        </header>

        <!-- Search Input Bar -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 Search posts by title..." 
                autocomplete="off"
            >
        </div>

        <!-- Status & Feedback Messages -->
        <div id="loadingMessage" class="status-msg hidden">
            <div class="spinner"></div>
            <p>Fetching posts from server, please wait...</p>
        </div>

        <div id="errorMessage" class="status-msg error-msg hidden"></div>
        <div id="emptyMessage" class="status-msg empty-msg hidden">
            <p>⚠️ No posts match your search criteria. Try a different keyword!</p>
        </div>

        <!-- Dynamic Posts Grid Container -->
        <main id="postsContainer" class="posts-grid">
            <!-- Dynamically injected post cards will appear here -->
        </main>
    </div>

    <!-- JavaScript linked with defer -->
    <script src="script.js" defer></script>
</body>
</html>
